[project]
name = "real-time-voice"
version = "0.1.0"
description = "Local real-time voice avatar skeleton"
requires-python = ">=3.11,<3.12"
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
writing = ["deepagents>=0.5.9,<0.6", "langchain-deepseek>=1.1,<2"]
chat = ["deepagents>=0.5.9,<0.6", "langchain-deepseek>=1.1,<2"]
observability = [
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
]
asr = [
  "funasr>=1.2,<2",
  "torch==2.2.2",
  "torchaudio==2.2.2",
  # Keep the librosa/numba stack on versions that ship Intel macOS wheels for
  # the project's Python 3.11 runtime; newer llvmlite releases build from
  # source and require a separately installed LLVM toolchain.
  "numpy<2",
  "numba==0.58.1",
  "llvmlite==0.41.1",
]
cloud-asr = ["dashscope>=1.25,<2"]
nls-asr = [
  "nls @ git+https://github.com/aliyun/alibabacloud-nls-python-sdk.git@v1.0.2",
  "certifi>=2023.7",
  "aliyun-python-sdk-core>=2.15.1,<3",
  "alibabacloud-credentials==1.0.12",
]
tts = ["piper-tts>=1.4,<2"]
webrtc = ["aiortc>=1.10,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_model: loads locally installed ASR/TTS models; excluded from the default suite",
  "real_cloud: calls a configured external model API; excluded from the default suite",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["data/writing/*.json", "data/practice/*.json", "data/chat/*.json"]
