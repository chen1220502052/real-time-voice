# Enable after DNS and the certificate are ready. Accounts are managed by the app.
server {
    listen 443 ssl;
    server_name aimaoren.com www.aimaoren.com;
    ssl_certificate /etc/letsencrypt/live/aimaoren.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aimaoren.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

    auth_basic off; # Application accounts replace the shared trial password.
    auth_basic_user_file /etc/nginx/voice-trial.htpasswd;

    # Account sessions authenticate bootstrap. Overwrite legacy trusted headers.
    location = /api/browser-session {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User $remote_user;
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
    }

    # These routes still require the application's signed session cookie.
    # Do not issue HTTP Basic challenges during a mobile WS upgrade.
    location = /ws {
        auth_basic off;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User "";
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /api/connection-events {
        auth_basic off;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User "";
        proxy_set_header Authorization "";
    }

    location = /api/browser-disconnect {
        auth_basic off;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User "";
        proxy_set_header Authorization "";
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_set_header X-Authenticated-User "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
