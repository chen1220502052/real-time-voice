map $http_upgrade $voice_tunnel_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name local.aimaoren.com;
    ssl_certificate /etc/letsencrypt/live/local.aimaoren.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/local.aimaoren.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
    auth_basic off;

    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Authenticated-User "";
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voice_tunnel_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
