# Loaded in nginx's http context. Do not log URLs, query strings, cookies or text.
map "$status:$uri" $ecs_business_activity {
    default 0;
    ~^2[0-9][0-9]:/$ 1;
    ~^2[0-9][0-9]:/(text|voice|practice|writing)\.html$ 1;
    ~^2[0-9][0-9]:/api/auth/(login|register)$ 1;
    ~^2[0-9][0-9]:/api/(text-bot|learning|account|practice|writing)/ 1;
    ~^101:/ws$ 1;
}
log_format ecs_activity escape=json '{"t":$msec}';
access_log /var/log/nginx/ecs-activity.log ecs_activity if=$ecs_business_activity;
